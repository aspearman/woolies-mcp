name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm pack

      - name: Attach the package to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "pkg-v$version" *.tgz \
            --target "$GITHUB_SHA" \
            --title "Package $version" \
            --notes "Run with: npx -y https://github.com/$GITHUB_REPOSITORY/releases/download/pkg-v$version/$(ls *.tgz)"
