name: Docker build and publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.check.json
      - src/**
      - .github/workflows/docker-build-and-publish.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One publish at a time, so two pushes cannot race to create the same release.
concurrency:
  group: docker-build-and-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version and image name
        id: meta
        run: |
          {
            echo "version=$(node -p "require('./package.json').version")"
            echo "short=${GITHUB_SHA::7}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release pins the first image built for a version by digest. A later push on the same
      # version moves the version tag but leaves the release, and its digest, alone.
      - name: Create the image release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag="image-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; leaving it alone."
            exit 0
          fi
          fence='```'
          notes=$(printf 'Docker image for linux/amd64 and linux/arm64, built from %s.\n\nPull it pinned by digest:\n\n%s\ndocker pull %s:%s@%s\n%s\n' \
            "$GITHUB_SHA" "$fence" "$IMAGE" "$VERSION" "$DIGEST" "$fence")
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Image $VERSION" \
            --notes "$notes"
